<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="클래식카 부품 계산기 휴대폰 화면. 지금은 벤츠 W140 편입니다.">
<title>클래식카 부품 계산기</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* 휴대폰 전용: 검색 - 차종 - 묶음 - 부품 카드 - 아래 합계 띠. 한 손으로 쓰는 화면 */
:root{--bg:#f4f6f5;--panel:#ffffff;--ink:#17201b;--mute:#5d6b63;--line:#d5dcd8;--accent:#1c6424;--accent-bg:#e6f1e7;--warn:#a51e1e;--band:#12241a;--band-fg:#f2f7f3;--band-mute:#a3b5a9;
--sans:'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif;--mono:'JetBrains Mono',ui-monospace,Menlo,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101613;--panel:#18211c;--ink:#e8efe9;--mute:#9aaba1;--line:#2c3a32;--accent:#6fcf7b;--accent-bg:#1c3122;--warn:#ff8f8f;--band:#0a120d;--band-fg:#eef5ef;--band-mute:#8fa397;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101613;--panel:#18211c;--ink:#e8efe9;--mute:#9aaba1;--line:#2c3a32;--accent:#6fcf7b;--accent-bg:#1c3122;--warn:#ff8f8f;--band:#0a120d;--band-fg:#eef5ef;--band-mute:#8fa397;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
button,input,select{font:inherit;color:var(--ink)}
a{color:var(--accent);text-underline-offset:3px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.g{padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
.top{background:var(--band);color:var(--band-fg);padding-block:10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.top h1{margin:0;font-size:16px;font-weight:700}
.top h1 small{font-size:12px;font-weight:500;color:var(--band-mute);margin-left:6px}
.top a{color:var(--band-mute);font-size:12px;text-decoration:none;border:1px solid var(--band-mute);border-radius:4px;padding:2px 8px;white-space:nowrap}
.tools{position:sticky;top:env(safe-area-inset-top,0px);z-index:3;background:var(--bg);padding-block:10px 8px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
#q{width:100%;border:2px solid var(--accent);border-radius:8px;background:var(--panel);padding:11px 12px;font-size:16px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 13px;font-size:14px;font-weight:700;white-space:nowrap}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.frow{display:flex;gap:8px;align-items:center}
.frow select{flex:1 1 auto;min-width:0;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:8px 10px;font-size:15px;font-weight:700}
#cnt{flex:0 0 auto;font-size:13px;color:var(--mute);white-space:nowrap}
.list{display:flex;flex-direction:column;gap:8px;padding-block:10px calc(96px + env(safe-area-inset-bottom,0px))}
.sec{margin:10px 0 0;font-size:13px;font-weight:700;color:var(--mute)}
.c{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center}
.c.on{border-color:var(--accent);background:var(--accent-bg)}
.n{grid-column:1 / -1;font-weight:700;font-size:16px;min-width:0}
.n em{font-style:normal;font-size:12px;color:var(--warn);margin-left:6px;white-space:nowrap}
.pn{justify-self:start;background:none;border:0;border-bottom:1px dashed var(--mute);padding:0;font-family:var(--mono);font-weight:700;font-size:18px;letter-spacing:.01em;white-space:nowrap}
.w{font-family:var(--mono);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.w.no{font-family:var(--sans);font-weight:400;font-size:13px;color:var(--mute)}
.f{grid-column:1 / -1;font-size:13px;color:var(--mute);min-width:0}
.a{grid-column:1 / -1;display:flex;gap:8px;margin-top:4px}
.a button,.a summary{border:1px solid var(--accent);border-radius:8px;padding:8px 0;font-size:14px;font-weight:700;text-align:center;background:var(--panel);color:var(--accent)}
.a .add{flex:1 1 0}
.c.on .add{background:var(--accent);color:var(--panel)}
.a details{flex:1 1 0}
.a summary{list-style:none;cursor:pointer}
.a summary::-webkit-details-marker{display:none}
.a details[open]{flex:1 1 100%}
.lk{display:flex;flex-direction:column;margin-top:6px;border:1px solid var(--line);border-radius:8px;background:var(--panel);overflow:hidden}
.lk a{padding:11px 12px;text-decoration:none;font-size:14px;border-bottom:1px solid var(--line)}
.lk a:last-child{border-bottom:0}
.a:has(details[open]){flex-wrap:wrap}
.more{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:0 12px}
.more summary{padding:12px 0;font-weight:700;cursor:pointer}
.more p{margin:0 0 8px;font-size:13px;color:var(--mute)}
.more .x{color:var(--ink);font-weight:700}
.more .lk{margin:0 0 12px}
.empty{padding:28px 0;text-align:center;color:var(--mute)}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--band);color:var(--band-fg);padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:12px}
.bar div{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.bar small{color:var(--band-mute);font-size:12px}
.bar strong{font-family:var(--mono);font-size:21px;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar button{flex:0 0 auto;background:var(--band-fg);color:var(--band);border:0;border-radius:8px;padding:11px 16px;font-weight:700;font-size:15px}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:6;max-height:82vh;overflow:auto;background:var(--panel);border-top:2px solid var(--ink);border-radius:14px 14px 0 0;box-shadow:0 -8px 24px rgba(0,0,0,.25);padding-top:14px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
.sh{display:flex;justify-content:space-between;align-items:center;font-size:17px}
.sh button,.sb button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 12px;font-size:14px}
.ci{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:8px 0;border-bottom:1px solid var(--line)}
.ci b{min-width:0}
.ci small{font-family:var(--mono);color:var(--mute)}
.ci .t{font-family:var(--mono);font-weight:700;white-space:nowrap;text-align:right}
.qy{display:flex;align-items:center;gap:6px;justify-content:flex-end}
.qy button{width:34px;height:34px;border:1px solid var(--line);border-radius:8px;background:var(--panel);font-size:18px;line-height:1}
.qy span{min-width:22px;text-align:center;font-family:var(--mono)}
.rate{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mute)}
.rate input{width:92px;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:8px 10px;font-family:var(--mono);font-size:16px}
.sb{display:flex;gap:8px}
.sb button{flex:1 1 0;padding:11px 0;font-weight:700}
.sb .pri{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.note{margin:0;font-size:13px;color:var(--mute)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:8;background:var(--ink);color:var(--panel);font-weight:700;padding:10px 16px;border-radius:8px;max-width:calc(100% - 28px);text-align:center}
#newv{position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top,0px));z-index:9;background:#ffd84d;color:#2a2300;border:0;border-radius:8px;padding:10px 16px;font-weight:700;max-width:calc(100% - 28px)}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>

<header class="top g"><h1>클래식카 부품 계산기<small>W140</small></h1><a href="../?pc=1">PC 화면</a></header>
<div class="tools g">

</div>

</div>
<div class="toast" id="toast" role="status" hidden></div>

<div class="lk"><a href="${TROLL}" target="_blank" rel="noopener">틀린 곳 제보 - 트롤파츠</a><a href="../?pc=1">PC 화면으로 보기 (수량, 애프터 가격, 작업별 담기)</a></div></details>`;
function render(){const v=shown();$('cnt').textContent='부품 '+v.length+'가지';
$('mods').innerHTML=MODS.map(m=>`<button type="button" data-m="${m[0]}" aria-pressed="${ST.my===m[0]}">${m[1]}</button>`).join('');
let h='',last='';const name=Object.fromEntries(D.sec.map(s=>[s[0],s[1]]));
for(const r of v){if(!ST.cat&&r.s!==last){h+=`<h2 class="sec">${esc(name[r.s])}</h2>`;last=r.s}h+=card(r)}
$('list').innerHTML=(h||'<p class="empty">맞는 부품이 없습니다. 차종이나 묶음을 바꿔 보십시오.</p>')+MORE;total()}
function total(){const ids=Object.keys(ST.cart).filter(k=>ST.cart[k]>0);let s=0,miss=0;
for(const id of ids){const r=D.rows.find(x=>x.id===id);if(!r)continue;if(r.ref)s+=r.ref*ST.usd*ST.cart[id];else miss++}
$('bn').textContent='담은 부품 '+ids.length+'가지'+(miss?' (가격 없는 것 '+miss+'가지 제외)':'');$('sum').textContent=won(s);
$('items').innerHTML=ids.length?ids.map(id=>{const r=D.rows.find(x=>x.id===id);if(!r)return'';return `<div class="ci"><b>${esc(r.ko)}</b><span class="t">${r.ref?won(r.ref*ST.usd*ST.cart[id]):'가격 없음'}</span><small>${esc(r.pn)}</small><span class="qy"><button type="button" data-q="-1" data-id="${id}" aria-label="하나 빼기">-</button><span>${ST.cart[id]}</span><button type="button" data-q="1" data-id="${id}" aria-label="하나 더">+</button></span></div>`}).join(''):'<p class="note">담은 부품이 없습니다.</p>'}
function listText(){const ids=Object.keys(ST.cart).filter(k=>ST.cart[k]>0);let s=0;const L=ids.map(id=>{const r=D.rows.find(x=>x.id===id);const t=r.ref?r.ref*ST.usd*ST.cart[id]:0;s+=t;return r.ko+' / '+r.pn+' / '+ST.cart[id]+'개'+(r.ref?' / '+won(t):'')});
return ['[W140 부품 목록]'].concat(L,['합계 어림: '+won(s)+' (1달러 '+ST.usd+'원, 배송비와 관부가세 제외)']).join('\n')}
function copy(t,ok){try{navigator.clipboard.writeText(t).then(ok,()=>toast('복사가 안 됐습니다. 길게 눌러 직접 복사해 주십시오.'))}catch(e){toast('복사가 안 됐습니다. 길게 눌러 직접 복사해 주십시오.')}}
$('cat').innerHTML='<option value="">전체 부품</option>'+D.sec.filter(s=>D.rows.some(r=>r.s===s[0])).map(s=>`<option value="${s[0]}">${esc(s[1])}</option>`).join('');
$('cat').value=ST.cat;$('usd').value=ST.usd;
$('cat').addEventListener('change',e=>{ST.cat=e.target.value;save();render();scrollTo(0,0)});
$('q').addEventListener('input',e=>{Q=e.target.value;render()});
$('usd').addEventListener('input',e=>{const n=Number(e.target.value);if(n>0){ST.usd=n;save();render()}});
$('mods').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;ST.my=b.dataset.m;save();render()});
$('list').addEventListener('click',e=>{const p=e.target.closest('.pn');if(p){copy(p.dataset.pn.replace(/\s+/g,''),()=>toast('부품번호 '+p.dataset.pn+' 복사했습니다'));return}
const a=e.target.closest('[data-add]');if(a){const id=a.dataset.add;if(ST.cart[id]>0)delete ST.cart[id];else ST.cart[id]=1;save();const c=a.closest('.c');const on=ST.cart[id]>0;c.classList.toggle('on',on);a.textContent=on?'담았습니다':'담기';total()}});
$('items').addEventListener('click',e=>{const b=e.target.closest('[data-q]');if(!b)return;const id=b.dataset.id;const n=(ST.cart[id]||0)+Number(b.dataset.q);if(n>0)ST.cart[id]=n;else delete ST.cart[id];save();render()});
$('open').addEventListener('click',()=>{$('cart').hidden=!$('cart').hidden});
$('close').addEventListener('click',()=>{$('cart').hidden=true});
$('clear').addEventListener('click',()=>{ST.cart={};save();render();toast('장바구니를 비웠습니다')});
$('copy').addEventListener('click',()=>copy(listText(),()=>toast('목록을 복사했습니다. 부품상에 붙여 보내십시오.')));
render();
(function(){try{if(!/netlify\.app$/.test(location.hostname))return;const s=document.createElement('script');s.async=true;s.src='https://gc.zgo.at/count.js';s.setAttribute('data-goatcounter','https://classiccar-parts.goatcounter.com/count');document.head.appendChild(s)}catch(e){}})();
;(()=>{const BUILD=1794572547;let busy=false;const bar=()=>{let n=$('newv');if(!n){n=document.createElement('button');n.id='newv';n.type='button';n.textContent='새 판이 나왔습니다. 눌러서 새로 고침';n.onclick=()=>location.reload();document.body.appendChild(n)}};
const chk=()=>{if(busy)return;busy=true;fetch('../version.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{busy=false;if(!j||!(j.build>BUILD))return;let tried='';try{tried=sessionStorage.getItem('w140rl')||''}catch(e){}if(tried===String(j.build)||!$('cart').hidden){bar();return}try{sessionStorage.setItem('w140rl',String(j.build))}catch(e){bar();return}location.reload()}).catch(()=>{busy=false})};
chk();document.addEventListener('visibilitychange',()=>{if(!document.hidden)chk()});setInterval(chk,180000)})();
</script>
</body>
